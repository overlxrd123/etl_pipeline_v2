etl_pipeline_v2:
  outputs:
    dev:
      type: sqlite
      threads: 1
      database: warehouse
      schema: main
      schemas_and_paths:
        main: "{{ env_var('ETL_SQLITE_PATH', '../warehouse.db') }}"
      schema_directory: "{{ env_var('ETL_DBT_SCHEMA_DIR', '../dbt_schemas') }}"
  target: dev
