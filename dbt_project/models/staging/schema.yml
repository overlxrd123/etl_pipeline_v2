version: 2

models:
  - name: stg_orders
    description: "清洗后的订单数据，仅包含已完成且金额>0的订单"
    columns:
      - name: order_id
        description: "订单ID (PK)"
        tests:
          - unique
          - not_null
      - name: net_amount
        description: "实付金额"
        tests:
          - not_null
      - name: order_status
        description: "订单状态（只保留 completed）"

  - name: stg_products
    description: "产品维度（保留停用产品的历史记录），含利润率和供应商信息"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: category
        tests:
          - not_null

  - name: stg_customers
    description: "客户维度（保留停用客户的历史记录），含城市和忠诚度等级"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_weather
    description: "天气维度，含天气分类和极端天气标记"
    columns:
      - name: weather_id
        tests:
          - unique
          - not_null

  - name: stg_crypto
    description: "加密汇率，仅保留价格>0的记录"
