version: 2

models:
  - name: mart_sales_daily
    description: "每日销售KPI看板 — 业务核心表，含环比和7日移动平均"
    columns:
      - name: date_id
        tests:
          - not_null
      - name: total_revenue
        description: "当日总营收"
      - name: order_count
        description: "当日订单数"
      - name: avg_order_value
        description: "平均订单金额"

  - name: mart_product_performance
    description: "产品维度分析 — 营收排名、品类占比、利润率"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: revenue_rank
        description: "营收排名（1=最高）"

  - name: mart_customer_segments
    description: "RFM客户分层 — Champions/Loyal/Potential/At Risk/Lost"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: segment
        description: "客户分层标签"

  - name: mart_weather_impact
    description: "天气对销售影响 — 城市×日期粒度对比，含剔除日期/季节波动的订单指数"
    columns:
      - name: weather_category
        tests:
          - not_null
      - name: orders_index_pct
        description: "订单指数（100=该城市平常水平），已剔除日期/季节波动"
        tests:
          - not_null

  - name: mart_weather_effect
    description: >
      天气效应还原 — 用「同日跨城市对比」隔离季节/周末扰动，
      还原仿真设定的天气乘数（雨天 0.90 / 降雪·雷暴 0.80 / 高温 0.95）。
      同时输出未隔离口径（confounded_ratio）作为对照。
    columns:
      - name: factor
        description: "驱动因子：rain / snow / storm / heat"
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['rain', 'snow', 'storm', 'heat']
      - name: setting_ratio
        description: "仿真设定值（与 config/settings.py 保持一致）"
        tests:
          - not_null
      - name: isolated_ratio
        description: "同日跨城市对比后的还原值；无样本时为 NULL（如雷暴）"

  - name: mart_crypto_impact
    description: "币价对支付行为影响 — BTC 日涨跌幅与加密支付占比"
    columns:
      - name: date_id
        tests:
          - not_null
      - name: close_price_usd
        description: "BTC 当日收盘价（USD）"
      - name: crypto_order_share_pct
        description: "加密支付订单占比（%）"
